name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-template:
    name: Validate template (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            runner: ubuntu-24.04
          - platform: osx-64
            runner: macos-15-intel
          - platform: osx-arm64
            runner: macos-15
          - platform: win-64
            runner: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: dev
          locked: true

      - name: Set up development environment and Git hook
        run: pixi run --environment dev --platform ${{ matrix.platform }} --locked setup-dev

      - name: Run prek hooks
        run: pixi run --environment dev --platform ${{ matrix.platform }} --locked hooks

      - name: Run mypy
        run: pixi run --environment dev --platform ${{ matrix.platform }} --locked mypy

      - name: Run tests
        run: pixi run --environment dev --platform ${{ matrix.platform }} --locked test

  validate-generated-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          environments: dev
          locked: true

      - name: Generate project from template
        run: |
          python3 scripts/bootstrap_project.py template-smoke "$RUNNER_TEMP/template-smoke" \
            --author-name "CI" \
            --author-email "ci@example.com"

      - name: Validate generated project
        working-directory: ${{ runner.temp }}/template-smoke
        run: |
          git add --all
          pixi run --environment dev setup-dev
          pixi run --environment dev hooks
          pixi run --environment dev mypy
          pixi run --environment dev test
