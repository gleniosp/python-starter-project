name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Set up development environment and Git hook
        run: pixi run --environment dev setup-dev

      - name: Run prek hooks
        run: pixi run --environment dev hooks

      - name: Run mypy
        run: pixi run --environment dev mypy

      - name: Run tests
        run: pixi run --environment dev test

  validate-generated-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Generate project from template
        run: |
          python3 scripts/bootstrap_project.py template-smoke "$RUNNER_TEMP/template-smoke" \
            --author-name "CI" \
            --author-email "ci@example.com"

      - name: Validate generated project
        working-directory: ${{ runner.temp }}/template-smoke
        run: |
          git add --all
          pixi run --environment dev setup-dev
          pixi run --environment dev hooks
          pixi run --environment dev mypy
          pixi run --environment dev test
