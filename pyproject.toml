[project]
authors = [
    { name = "gleniosp", email = "11273108+gleniosp@users.noreply.github.com" },
]
dependencies = []
name = "python-starter-project"
requires-python = "~=3.14.0"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling==1.32.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/python_starter_project"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = { version = "~=3.14.0", build = "*_cp314" }

[tool.pixi.pypi-dependencies]
"python-starter-project" = { path = ".", editable = true }

[tool.pixi.tasks]
main = "python -m python_starter_project.main"

[tool.pixi.feature.lint.dependencies]
ruff = "==0.16.10"
mypy = "==2.4.0"
prek = "==0.5.5"

[tool.pixi.feature.lint.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
mypy = "mypy src scripts tests"
setup-dev = "prek install"
hooks = "prek run --all-files"

[tool.pixi.feature.test.dependencies]
pytest = "==9.1.1"

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pixi.environments]
dev = { features = ["test", "lint"], solve-group = "default" }

[tool.mypy]
explicit_package_bases = true
mypy_path = "src"
strict = true

[tool.ruff]
exclude = [".pixi"]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
